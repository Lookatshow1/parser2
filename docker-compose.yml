services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ads
    # SECURITY: Bind to localhost only - not exposed externally
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7
    # SECURITY: Bind to localhost only - not exposed externally
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ads
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev_secret
      JWT_ALG: HS256
      ACCESS_TTL_MIN: 60
      REFRESH_TTL_DAYS: 7
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      WEB_BASE_URL: http://localhost:3000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@local.test
      CREDENTIALS_ENC_KEYS: dev:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      CREDENTIALS_ENC_ACTIVE_KID: dev
      ENABLE_DEV_ENDPOINTS: "true"
      DEMO_EMAIL: demo@example.com
      DEMO_PASSWORD: demo12345
      DEMO_ORG_NAME: "Демо-организация"
      DEMO_CONNECTIONS: "Яндекс.Директ: Демо 1,Яндекс.Директ: Демо 2"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: always

  worker:
    build: .
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q main-queue,celery
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ads
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev_secret
      JWT_ALG: HS256
      ACCESS_TTL_MIN: 60
      REFRESH_TTL_DAYS: 7
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      WEB_BASE_URL: http://localhost:3000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@local.test
      CREDENTIALS_ENC_KEYS: dev:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      CREDENTIALS_ENC_ACTIVE_KID: dev
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  beat:
    build: .
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ads
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev_secret
      JWT_ALG: HS256
      ACCESS_TTL_MIN: 60
      REFRESH_TTL_DAYS: 7
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      WEB_BASE_URL: http://localhost:3000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@local.test
      CREDENTIALS_ENC_KEYS: dev:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      CREDENTIALS_ENC_ACTIVE_KID: dev
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  web:
    image: node:18
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    working_dir: /app/apps/web
    volumes:
      - .:/app
      - web_node_modules:/app/apps/web/node_modules
    environment:
      INTERNAL_API_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=4096
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: always

  mailhog:
    image: mailhog/mailhog:latest
    # SECURITY: Bind to localhost only - not exposed externally
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: always

volumes:
  db_data:
  web_node_modules:
